name: Release APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-release:
    name: Build & Release APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17 (Temurin)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      - name: Generate Temporary Release Keystore
        run: |
          keytool -genkeypair \
            -v \
            -keystore release.keystore \
            -alias release-key \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -storepass release123 \
            -keypass release123 \
            -dname "CN=Release Signing, O=Android, C=US"
          echo "KEYSTORE_FILE=$GITHUB_WORKSPACE/release.keystore" >> $GITHUB_ENV
          echo "KEYSTORE_PASSWORD=release123" >> $GITHUB_ENV
          echo "KEY_ALIAS=release-key" >> $GITHUB_ENV
          echo "KEY_PASSWORD=release123" >> $GITHUB_ENV

      - name: Build Release APK
        run: ./gradlew :app:assembleRelease --stacktrace --no-daemon

      - name: Verify Release APK Exists
        run: |
          if [ ! -f "app/build/outputs/apk/release/app-release.apk" ]; then
            echo "Error: Release APK not found at app/build/outputs/apk/release/app-release.apk"
            exit 1
          fi
          echo "APK generated successfully: $(ls -lh app/build/outputs/apk/release/app-release.apk)"

      - name: Upload Release APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: release-apk
          path: app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error

      - name: Create GitHub Release Tag
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG_NAME="release-${{ github.run_number }}-${{ github.run_attempt }}"
          gh release create "$TAG_NAME" \
            app/build/outputs/apk/release/app-release.apk \
            --title "Release $TAG_NAME" \
            --notes "Automated production release build for Files App" \
            --latest || true

      - name: Summary Report
        run: |
          echo "### Production Release Build Summary" >> $GITHUB_STEP_SUMMARY
          echo "- **Status**: Succeeded" >> $GITHUB_STEP_SUMMARY
          echo "- **Target APK**: \`app/build/outputs/apk/release/app-release.apk\`" >> $GITHUB_STEP_SUMMARY
          echo "- **Artifact**: \`release-apk\`" >> $GITHUB_STEP_SUMMARY
          echo "- **Tag**: \`release-${{ github.run_number }}-${{ github.run_attempt }}\`" >> $GITHUB_STEP_SUMMARY
          echo "- **JDK**: Temurin 17" >> $GITHUB_STEP_SUMMARY