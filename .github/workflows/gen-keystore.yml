name: Generate Permanent Keystore (one-time)

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  gen-keystore:
    runs-on: ubuntu-latest
    steps:
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Generate permanent release keystore
        run: |
          keytool -genkeypair -v \
            -keystore files-release.keystore \
            -alias files-key \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -storepass 'FilesRel2026!' -keypass 'FilesRel2026!' \
            -dname "CN=Ravi Kumar, O=Files App, C=IN"
          echo "=== SHA-1 ==="
          keytool -list -v -keystore files-release.keystore -alias files-key \
            -storepass 'FilesRel2026!' 2>/dev/null | grep "SHA1:"
          echo "=== SHA-256 ==="
          keytool -list -v -keystore files-release.keystore -alias files-key \
            -storepass 'FilesRel2026!' 2>/dev/null | grep "SHA256:"

      - name: Upload keystore artifact
        uses: actions/upload-artifact@v4
        with:
          name: permanent-keystore
          path: files-release.keystore
